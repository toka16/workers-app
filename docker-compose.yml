# Local stack. Supabase (Postgres, Auth, Storage, Studio, Mailpit) runs via the Supabase CLI,
# which manages its own containers; this file runs the Next.js app next to it.
#
#   make up        # supabase start + docker compose up
#   open http://localhost:3000   (Studio: http://localhost:54323, e-mails: http://localhost:54324)

x-supabase-env: &supabase-env
  # The browser talks to Supabase on the host; the container reaches it via host.docker.internal.
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH}
  SUPABASE_INTERNAL_URL: http://host.docker.internal:54321
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      <<: *supabase-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - pnpm_store:/pnpm/store
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/robots.txt"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Production build served by the standalone Node server: `docker compose --profile prod up --build app-prod`
  app-prod:
    profiles: ["prod"]
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH}
        NEXT_PUBLIC_SITE_URL: http://localhost:3001
        SUPABASE_INTERNAL_URL: http://host.docker.internal:54321
      extra_hosts:
        - "host.docker.internal:host-gateway"
    ports:
      - "3001:3000"
    environment:
      <<: *supabase-env
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  node_modules:
  next_cache:
  pnpm_store:
